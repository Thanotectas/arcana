<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Cormorant; src: url("file:///home/user/arcana/src/app/fuentes/CormorantGaramond-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: Cormorant; src: url("file:///home/user/arcana/src/app/fuentes/CormorantGaramond-Italic.ttf"); font-style: italic; }
@font-face { font-family: Inter; src: url("file:///home/user/arcana/src/app/fuentes/Inter-Medium.ttf"); font-weight: 500; }
@font-face { font-family: Inter; src: url("file:///home/user/arcana/src/app/fuentes/Inter-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: Simbolos; src: url("file:///home/user/arcana/src/app/fuentes/NotoSansSymbols2.ttf"); }
html, body { margin: 0; padding: 0; background: #0b0716; }
svg { display: block; }
</style></head>
<body>
<svg id="lienzo" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const D = window.DATOS;
const W = 1080, H = 1920;
const SIGNOS = ["♈","♉","♊","♋","♌","♍","♎","♏","♐","♑","♒","♓"];
const SIM = { sol:"☉", luna:"☽", mercurio:"☿", venus:"♀", marte:"♂", jupiter:"♃", saturno:"♄", urano:"♅", neptuno:"♆", pluton:"♇", nodo_norte:"☊", ascendente:"AC" };
const COLOR_ASP = { trigono:"#8fc7ff", sextil:"#8fc7ff", cuadratura:"#ff7b9c", oposicion:"#ff7b9c", conjuncion:"#f1d99a" };
const ORO = "#f1d99a", ORO2 = "#d9b45a", VIO = "#b7a5ff", TXT = "#ece6f7";

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const suave = (x) => x * x * (3 - 2 * x);
const salida = (x) => 1 - Math.pow(1 - x, 3);
// Visibilidad de una escena con fundido de entrada y salida.
const ventana = (t, a, b, f = 0.6) => Math.min(suave(prog(t, a, a + f)), 1 - suave(prog(t, b - f, b)));
// Azar determinista para estrellas y chispas.
function azar(s) { let x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

const ESTRELLAS = Array.from({ length: 220 }, (_, i) => ({ x: azar(i) * W, y: azar(i + 999) * H, r: 0.6 + azar(i + 77) * 1.8, f: azar(i + 5) * 6.28, v: 0.6 + azar(i + 3) * 1.6 }));
const POLVO = Array.from({ length: 46 }, (_, i) => ({ x: azar(i + 400) * W, y: azar(i + 600) * H, r: 1.2 + azar(i + 800) * 2.6, v: 18 + azar(i + 900) * 40, f: azar(i + 1000) * 6.28 }));

function fondo(t) {
  let s = `<defs>
    <radialGradient id="cielo" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#2a1660"/><stop offset="0.5" stop-color="#140b30"/><stop offset="1" stop-color="#0b0716"/></radialGradient>
    <radialGradient id="brujas" cx="50%" cy="100%" r="60%"><stop offset="0" stop-color="#ff8a3d" stop-opacity="0.28"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f1d99a" stop-opacity="0.35"/><stop offset="1" stop-color="#8b6cf6" stop-opacity="0"/></radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="brilloSuave" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="circuloSibila"><circle cx="540" cy="720" r="270"/></clipPath>
  </defs>
  <rect width="${W}" height="${H}" fill="url(#cielo)"/>
  <rect width="${W}" height="${H}" fill="url(#brujas)"/>`;
  for (const e of ESTRELLAS) {
    const o = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * e.v + e.f));
    s += `<circle cx="${e.x.toFixed(1)}" cy="${e.y.toFixed(1)}" r="${e.r.toFixed(2)}" fill="#fff" opacity="${(o * 0.8).toFixed(2)}"/>`;
  }
  for (const p of POLVO) {
    const y = ((p.y - t * p.v) % H + H) % H;
    const x = p.x + Math.sin(t * 0.7 + p.f) * 18;
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${p.r.toFixed(2)}" fill="${ORO}" opacity="${(0.25 + 0.35 * Math.sin(t + p.f) ** 2).toFixed(2)}" filter="url(#brilloSuave)"/>`;
  }
  return s;
}

const texto = (x, y, cont, { tam = 48, fam = "Inter", peso = 500, color = TXT, op = 1, estilo = "normal", esp = 0, anchor = "middle", filtro = "" } = {}) =>
  `<text x="${x}" y="${y}" font-family="${fam}, Simbolos" font-size="${tam}" font-weight="${peso}" font-style="${estilo}" fill="${color}" opacity="${op.toFixed(3)}" xml:space="preserve" text-anchor="${anchor}" letter-spacing="${esp}" ${filtro ? `filter="url(#${filtro})"` : ""}>${cont}</text>`;

/** Rueda astral: anillo, signos, casas, planetas y aspectos, cada parte con su progreso (0..1). */
function rueda(cx, cy, R, c, p, giro = 0, op = 1, mostrarAspectos = true) {
  const ang = (lon) => ((180 + (lon - c.asc) + giro) * Math.PI) / 180;
  const pt = (lon, r) => [cx + r * Math.cos(ang(lon)), cy - r * Math.sin(ang(lon))];
  const rS = R * 0.86, rC = R * 0.74, rP = R * 0.61, rA = R * 0.47;
  let s = `<g opacity="${op.toFixed(3)}">`;
  s += `<circle cx="${cx}" cy="${cy}" r="${R * 1.08}" fill="url(#halo)" opacity="${(0.8 * p.anillo).toFixed(2)}"/>`;
  for (const [r, w] of [[R, 3], [rS, 1.5], [rC, 1.2]]) {
    const C = 2 * Math.PI * r;
    s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${ORO2}" stroke-width="${w}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - p.anillo)).toFixed(1)}" transform="rotate(${-90 - giro} ${cx} ${cy})" opacity="0.9"/>`;
  }
  s += `<circle cx="${cx}" cy="${cy}" r="${rA}" fill="#0b0716" fill-opacity="0.45" stroke="${VIO}" stroke-opacity="${(0.4 * p.anillo).toFixed(2)}" stroke-width="1"/>`;
  for (let i = 0; i < 12; i++) {
    const q = salida(prog(p.signos, i / 14, i / 14 + 0.25));
    const [x1, y1] = pt(i * 30, rS), [x2, y2] = pt(i * 30, R);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ORO2}" stroke-width="1.2" opacity="${(0.7 * q).toFixed(2)}"/>`;
    const [gx, gy] = pt(i * 30 + 15, (R + rS) / 2);
    s += `<text x="${gx}" y="${gy}" font-family="Simbolos" font-size="${(R * 0.085 * (0.6 + 0.4 * q)).toFixed(1)}" fill="${ORO}" text-anchor="middle" dominant-baseline="central" opacity="${q.toFixed(2)}" filter="url(#brilloSuave)">${SIGNOS[i]}︎</text>`;
  }
  c.cuspides.forEach((lon, i) => {
    const q = salida(prog(p.casas, i / 14, i / 14 + 0.3));
    const [x1, y1] = pt(lon, rC), [x2, y2] = pt(lon, rC - (rC - rA) * q);
    const eje = i === 0 || i === 3 || i === 6 || i === 9;
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${eje ? ORO : VIO}" stroke-width="${eje ? 2 : 1}" opacity="${(eje ? 0.9 : 0.5) * (q > 0 ? 1 : 0)}"/>`;
  });
  if (mostrarAspectos) {
    const pos = Object.fromEntries(c.planetas.map((x) => [x.cuerpo, x.longitud]));
    c.aspectos.forEach((a, i) => {
      if (pos[a.a] === undefined || pos[a.b] === undefined) return;
      const q = suave(prog(p.aspectos, i / (c.aspectos.length + 3), i / (c.aspectos.length + 3) + 0.25));
      if (q <= 0) return;
      const [x1, y1] = pt(pos[a.a], rA), [x2, y2] = pt(pos[a.b], rA);
      const L = Math.hypot(x2 - x1, y2 - y1);
      s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${COLOR_ASP[a.tipo]}" stroke-width="2.2" stroke-dasharray="${L.toFixed(1)}" stroke-dashoffset="${(L * (1 - q)).toFixed(1)}" opacity="0.85" filter="url(#brilloSuave)"/>`;
    });
  }
  c.planetas.filter((x) => x.cuerpo !== "nodo_norte").forEach((pl, i) => {
    const q = salida(prog(p.planetas, i / 13, i / 13 + 0.3));
    if (q <= 0) return;
    const [x, y] = pt(pl.longitud, rP * q);
    const [mx, my] = pt(pl.longitud, rC);
    s += `<circle cx="${mx}" cy="${my}" r="3" fill="${ORO}" opacity="${q.toFixed(2)}"/>`;
    s += `<text x="${x}" y="${y}" font-family="Simbolos" font-size="${(R * 0.095).toFixed(1)}" fill="${pl.cuerpo === "sol" || pl.cuerpo === "luna" ? "#ffffff" : ORO}" text-anchor="middle" dominant-baseline="central" opacity="${q.toFixed(2)}" filter="url(#brillo)">${SIM[pl.cuerpo]}︎</text>`;
  });
  return s + "</g>";
}

/** Burbuja del chat del directo, con el texto que se va escribiendo. */
function burbuja(x, y, w, autor, cont, q, op) {
  const n = Math.round(cont.length * clamp(q));
  const visible = cont.slice(0, n) + (q < 1 && Math.floor(Date.now() / 1) % 2 === 0 ? "" : "");
  return `<g opacity="${op.toFixed(3)}">
    <rect x="${x}" y="${y}" width="${w}" height="132" rx="34" fill="#1d1340" stroke="${VIO}" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="${x + 62}" cy="${y + 66}" r="34" fill="#8b6cf6"/>
    ${texto(x + 62, y + 79, autor[0], { tam: 36, peso: 600, color: "#fff" })}
    ${texto(x + 116, y + 52, autor, { tam: 28, peso: 600, color: VIO, anchor: "start" })}
    ${texto(x + 116, y + 98, visible + (q < 1 ? "|" : ""), { tam: 34, color: TXT, anchor: "start" })}
  </g>`;
}

function escenaIntro(t) {
  const op = ventana(t, 0, 4.8, 0.5);
  if (op <= 0) return "";
  const q = salida(prog(t, 0.1, 1.6));
  let s = `<g opacity="${op.toFixed(3)}">`;
  s += `<circle cx="540" cy="720" r="${340 + 10 * Math.sin(t * 2)}" fill="url(#halo)"/>`;
  s += `<g opacity="${q.toFixed(2)}" transform="translate(540 720) scale(${(0.9 + 0.1 * q).toFixed(3)}) translate(-540 -720)">`;
  s += `<image href="file:///home/user/arcana/public/marca/sibila/base.jpg" x="270" y="450" width="540" height="540" preserveAspectRatio="xMidYMid slice" clip-path="url(#circuloSibila)"/>`;
  s += `<circle cx="540" cy="720" r="272" fill="none" stroke="${ORO}" stroke-width="5" filter="url(#brillo)"/>`;
  s += `</g>`;
  // Luna creciente de la noche de brujas.
  s += `<g opacity="${suave(prog(t, 0.6, 1.6)).toFixed(2)}"><circle cx="870" cy="300" r="70" fill="${ORO}" filter="url(#brillo)"/><circle cx="900" cy="282" r="64" fill="#1b0f3d"/></g>`;
  s += texto(540, 1150, "DOMINGO 1 DE NOVIEMBRE", { tam: 40, peso: 600, color: ORO, esp: 8, op: suave(prog(t, 0.8, 1.6)) });
  s += texto(540, 1290, "Sibila en vivo", { tam: 128, fam: "Cormorant", estilo: "italic", color: "#fff", op: suave(prog(t, 1.2, 2.2)), filtro: "brilloSuave" });
  s += texto(540, 1400, "tú eliges qué leer", { tam: 76, fam: "Cormorant", peso: 600, color: TXT, op: suave(prog(t, 1.8, 2.8)) });
  s += texto(540, 1530, "Tu carta astral y tu sinastría, dibujadas en pantalla", { tam: 36, color: VIO, op: suave(prog(t, 2.6, 3.4)) });
  return s + "</g>";
}

function escenaCarta(t) {
  const op = ventana(t, 4.3, 14.6, 0.6);
  if (op <= 0) return "";
  const c = D.carta;
  const sol = c.planetas.find((x) => x.cuerpo === "sol"), luna = c.planetas.find((x) => x.cuerpo === "luna");
  let s = `<g opacity="${op.toFixed(3)}">`;
  s += texto(540, 175, "Tu carta astral", { tam: 104, fam: "Cormorant", peso: 600, color: "#fff", op: suave(prog(t, 4.4, 5.2)), filtro: "brilloSuave" });
  s += texto(540, 255, "dibujada en vivo, planeta por planeta", { tam: 50, fam: "Cormorant", estilo: "italic", color: ORO, op: suave(prog(t, 4.8, 5.6)) });
  s += burbuja(90, 330, 900, "Valentina", "carta astral 14/03/1995 10:30 Medellín", prog(t, 5.2, 7.2), suave(prog(t, 5.0, 5.4)));
  const p = { anillo: suave(prog(t, 6.6, 8.0)), signos: prog(t, 7.2, 9.0), casas: prog(t, 8.2, 9.4), planetas: prog(t, 8.8, 11.0), aspectos: prog(t, 10.6, 12.6) };
  s += rueda(540, 1000, 410, c, p, (t - 6.6) * 2.2, 1);
  s += texto(540, 1530, `☉︎ ${sol.signo}  ·  ☽︎ ${luna.signo}  ·  AC ${c.ascSigno}`, { tam: 54, fam: "Cormorant", peso: 600, color: ORO, op: suave(prog(t, 11.6, 12.4)), filtro: "brilloSuave" });
  s += texto(540, 1610, "Sol, Luna y Ascendente: tu esencia en tres palabras", { tam: 34, color: TXT, op: suave(prog(t, 12.0, 12.8)) });
  s += texto(540, 1760, "Escribe en el chat: carta astral + fecha, hora y ciudad", { tam: 36, peso: 600, color: VIO, op: suave(prog(t, 12.4, 13.2)) });
  return s + "</g>";
}

function escenaSinastria(t) {
  const op = ventana(t, 14.0, 24.6, 0.6);
  if (op <= 0) return "";
  const A = D.a, B = D.b, S = D.sin;
  const cA = [540, 640], cB = [540, 1330], R = 245;
  let s = `<g opacity="${op.toFixed(3)}">`;
  s += texto(540, 165, "Sinastría en vivo", { tam: 100, fam: "Cormorant", peso: 600, color: "#fff", op: suave(prog(t, 14.2, 15.0)), filtro: "brilloSuave" });
  s += texto(540, 240, "¿Qué tan compatibles son?", { tam: 50, fam: "Cormorant", estilo: "italic", color: ORO, op: suave(prog(t, 14.6, 15.4)) });
  const entra = salida(prog(t, 14.6, 16.2));
  const dx = (1 - entra) * 600;
  const pa = { anillo: suave(prog(t, 14.6, 15.8)), signos: prog(t, 15.0, 16.2), casas: prog(t, 15.4, 16.4), planetas: prog(t, 15.6, 17.0), aspectos: 0 };
  s += `<g transform="translate(${-dx} 0)">${rueda(cA[0], cA[1], R, A, pa, (t - 14.6) * 3, 1, false)}</g>`;
  s += `<g transform="translate(${dx} 0)">${rueda(cB[0], cB[1], R, B, pa, -(t - 14.6) * 3, 1, false)}</g>`;
  const sA = A.planetas.find((x) => x.cuerpo === "sol"), sB = B.planetas.find((x) => x.cuerpo === "sol");
  s += texto(540, 345, `Laura · ☉︎ ${sA.signo}`, { tam: 40, peso: 600, color: VIO, op: suave(prog(t, 15.6, 16.4)) });
  s += texto(540, 1640, `Andrés · ☉︎ ${sB.signo}`, { tam: 40, peso: 600, color: VIO, op: suave(prog(t, 15.6, 16.4)) });
  // Hilos entre los planetas de cada uno, con una chispa que los recorre.
  const punto = (cx, cy, c, cuerpo, giro) => {
    const lon = cuerpo === "ascendente" ? c.asc : c.planetas.find((x) => x.cuerpo === cuerpo)?.longitud;
    if (lon === undefined) return null;
    const a = ((180 + (lon - c.asc) + giro) * Math.PI) / 180;
    return [cx + R * 0.61 * Math.cos(a), cy - R * 0.61 * Math.sin(a)];
  };
  S.aspectos.forEach((h, i) => {
    const q = suave(prog(t, 17.0 + i * 0.25, 17.9 + i * 0.25));
    if (q <= 0) return;
    const p1 = punto(cA[0], cA[1], A, h.a, (t - 14.6) * 3), p2 = punto(cB[0], cB[1], B, h.b, -(t - 14.6) * 3);
    if (!p1 || !p2) return;
    const lado = i % 2 === 0 ? -1 : 1;
    const ctrl = [540 + lado * (160 + (i % 3) * 70), (p1[1] + p2[1]) / 2];
    const d = `M${p1[0].toFixed(1)} ${p1[1].toFixed(1)} Q${ctrl[0].toFixed(1)} ${ctrl[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    s += `<path d="${d}" fill="none" stroke="${COLOR_ASP[h.tipo]}" stroke-width="2.6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${(1 - q).toFixed(3)}" opacity="0.9" filter="url(#brilloSuave)"/>`;
    const u = ((t - 17.9 - i * 0.25) * 0.5) % 1;
    if (q >= 1 && u >= 0) {
      const bx = (1 - u) ** 2 * p1[0] + 2 * (1 - u) * u * ctrl[0] + u * u * p2[0];
      const by = (1 - u) ** 2 * p1[1] + 2 * (1 - u) * u * ctrl[1] + u * u * p2[1];
      s += `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="6" fill="#fff" filter="url(#brillo)"/>`;
    }
  });
  // Afinidad en el centro, contando hasta el puntaje.
  const qa = suave(prog(t, 19.4, 21.0));
  if (qa > 0) {
    const n = Math.round(S.puntaje * qa);
    s += `<g opacity="${Math.min(1, qa * 2).toFixed(2)}"><circle cx="540" cy="985" r="${92 + 4 * Math.sin(t * 5)}" fill="#1d1340" stroke="${ORO}" stroke-width="4" filter="url(#brillo)"/>`;
    s += texto(540, 1000, `${n}%`, { tam: 78, fam: "Cormorant", peso: 600, color: "#fff" });
    s += texto(540, 1045, "afinidad", { tam: 24, peso: 600, color: ORO, esp: 4 }) + "</g>";
  }
  const dims = [["Emoción", "emocional"], ["Pasión", "pasion"], ["Comunicación", "comunicacion"], ["Estabilidad", "estabilidad"]];
  dims.forEach(([nombre, k], i) => {
    const q = salida(prog(t, 21.0 + i * 0.3, 22.2 + i * 0.3));
    if (q <= 0) return;
    const col = i % 2, fila = Math.floor(i / 2);
    const x = 110 + col * 450, y = 1720 + fila * 95;
    s += texto(x, y, nombre, { tam: 30, peso: 600, color: TXT, anchor: "start", op: q });
    s += texto(x + 400, y, `${Math.round(S.dimensiones[k] * q)}%`, { tam: 30, peso: 600, color: ORO, anchor: "end", op: q });
    s += `<rect x="${x}" y="${y + 16}" width="400" height="12" rx="6" fill="#ffffff" opacity="0.12"/>`;
    s += `<rect x="${x}" y="${y + 16}" width="${(4 * S.dimensiones[k] * q).toFixed(1)}" height="12" rx="6" fill="${i === 1 ? "#ff7b9c" : ORO}" filter="url(#brilloSuave)"/>`;
  });
  return s + "</g>";
}

function escenaCierre(t) {
  const op = suave(prog(t, 24.2, 24.9));
  if (op <= 0) return "";
  let s = `<g opacity="${op.toFixed(3)}">`;
  const q = salida(prog(t, 24.3, 25.3));
  s += `<image href="file:///home/user/arcana/public/marca/icono-arcana.svg" x="${540 - 80 * q}" y="${250 - 80 * q + 80}" width="${160 * q}" height="${160 * q}"/>`;
  s += texto(540, 560, "Sibila en vivo", { tam: 116, fam: "Cormorant", peso: 600, color: "#fff", op: suave(prog(t, 24.5, 25.3)), filtro: "brilloSuave" });
  s += texto(540, 660, "DOMINGO 1 DE NOVIEMBRE", { tam: 44, peso: 600, color: ORO, esp: 8, op: suave(prog(t, 24.8, 25.5)) });
  s += texto(540, 740, "8:00 p.m. · hora de Colombia", { tam: 46, fam: "Cormorant", estilo: "italic", color: TXT, op: suave(prog(t, 25.0, 25.7)) });
  const qq = suave(prog(t, 25.3, 26.1));
  s += `<g opacity="${qq.toFixed(2)}"><rect x="330" y="820" width="420" height="420" rx="28" fill="#f1d99a" filter="url(#brillo)"/>
    <svg x="350" y="840" width="380" height="380" viewBox="${D.qrViewBox}">${D.qrCuerpo}</svg></g>`;
  s += texto(540, 1305, "Escanéalo y activa el recordatorio", { tam: 34, color: VIO, op: qq });
  s += texto(540, 1420, "En vivo en YouTube @miarcana", { tam: 40, peso: 600, color: TXT, op: suave(prog(t, 25.8, 26.5)) });
  s += texto(540, 1500, "Pregúntale gratis en el chat:", { tam: 36, color: TXT, op: suave(prog(t, 26.1, 26.8)) });
  s += texto(540, 1556, "carta astral · sinastría · tarot · aura", { tam: 40, fam: "Cormorant", peso: 600, color: ORO, op: suave(prog(t, 26.1, 26.8)) });
  s += texto(540, 1720, "miarcana.com", { tam: 70, fam: "Cormorant", peso: 600, color: ORO, op: suave(prog(t, 26.5, 27.2)), filtro: "brillo" });
  return s + "</g>";
}

window.DURACION = 30;
window.pintar = (t) => {
  document.getElementById("lienzo").innerHTML = fondo(t) + escenaIntro(t) + escenaCarta(t) + escenaSinastria(t) + escenaCierre(t);
};
window.pintar(0);
</script>
</body></html>
