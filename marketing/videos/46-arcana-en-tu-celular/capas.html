<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:C;src:url(../../../src/app/fuentes/CormorantGaramond-SemiBold.ttf)}
@font-face{font-family:CI;src:url(../../../src/app/fuentes/CormorantGaramond-Italic.ttf)}
@font-face{font-family:I;src:url(../../../src/app/fuentes/Inter-SemiBold.ttf)}
@font-face{font-family:IR;src:url(../../../src/app/fuentes/Inter-Regular.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent;font-variant-numeric:lining-nums}
#sombra{position:absolute;left:0;right:0;top:0;height:560px;background:linear-gradient(180deg,rgba(11,7,22,.85) 0%,rgba(11,7,22,.5) 55%,rgba(11,7,22,0) 100%)}
#sombra2{position:absolute;left:0;right:0;bottom:0;height:820px;background:linear-gradient(0deg,rgba(11,7,22,.92) 0%,rgba(11,7,22,.6) 55%,rgba(11,7,22,0) 100%);opacity:0}
.c{position:absolute;left:60px;right:60px;text-align:center;opacity:0}
.brillo{font-family:C;color:#f1d99a;text-shadow:0 0 40px rgba(241,217,154,.45),0 0 100px rgba(139,108,246,.45),0 3px 16px #0b0716}
.sub{font-family:I;font-size:30px;letter-spacing:.3em;color:#cdbfff;text-shadow:0 2px 10px #0b0716}
.pill{display:inline-block;padding:16px 44px;border-radius:999px;background:linear-gradient(180deg,#f6e2a8,#d6b065);font-family:I;font-size:52px;color:#1b1230;box-shadow:0 10px 50px rgba(241,217,154,.45)}
.chip{display:inline-block;padding:14px 32px;border-radius:999px;border:2px solid rgba(241,217,154,.55);background:rgba(20,13,36,.88);font-family:I;font-size:36px;color:#fff}
#tel{position:absolute;left:50%;top:420px;width:560px;height:1212px;margin-left:-280px;border-radius:70px;padding:16px;box-sizing:border-box;
  background:linear-gradient(160deg,#2a2148,#120c22);box-shadow:0 0 0 3px rgba(241,217,154,.55),0 40px 100px rgba(0,0,0,.75),0 0 140px rgba(139,108,246,.55);opacity:0}
#pantalla{position:relative;width:100%;height:100%;border-radius:56px;overflow:hidden;background:#0b0716}
#pantalla img{position:absolute;left:0;top:0;width:100%;opacity:0}
.marca{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-family:I;font-size:24px;letter-spacing:.3em;color:#ece6f7;text-shadow:0 2px 10px #0b0716;opacity:.85}
.marca b{color:#f1d99a}
</style></head><body>
<div id="sombra"></div><div id="sombra2"></div>
<div class="c" id="a" style="top:120px"><div class="sub">NUEVO EN ARCANA</div>
  <div class="brillo" style="font-size:112px;line-height:1.02;margin-top:14px">¿Me llevas en<br>tu celular? 📱</div></div>
<div id="tel"><div id="pantalla">
  <img id="p1" src="pantallas/1-app.png"><img id="p2" src="pantallas/2-pasos.png"><img id="p3" src="pantallas/3-juego.png"><img id="p4" src="pantallas/4-carta.png">
</div></div>
<div class="c" id="b" style="top:96px"><div class="pill">miarcana.com/app</div>
  <div class="brillo" style="font-size:76px;line-height:1.05;margin-top:22px">En un par de toques ✨</div></div>
<div class="c" id="b2" style="top:96px"><div class="pill">miarcana.com/app</div>
  <div class="brillo" style="font-size:76px;line-height:1.05;margin-top:22px">La carta escondida 🔮</div></div>
<div class="c" id="g" style="top:1668px"><span class="chip">🎁 1 crédito de regalo al instalarla</span></div>
<div class="c" id="d" style="top:120px"><div class="brillo" style="font-size:96px;line-height:1.04">Cada día,<br>una carta nueva 🔮</div></div>
<div class="c" id="z" style="top:1350px"><div class="pill" style="font-size:60px">miarcana.com/app</div>
  <div style="margin-top:26px"><span class="chip">🎁 1 crédito de regalo</span></div>
  <div style="font-family:IR;font-size:32px;color:#ece6f7;margin-top:20px;text-shadow:0 2px 10px #0b0716">Gratis · Android y iPhone · casi no ocupa espacio</div></div>
<p class="marca" id="m"><b>ARCANA</b> · SIBILA TE LEE</p>
<script>
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),pr=(t,a,b)=>cl((t-a)/(b-a)),su=x=>x*x*(3-2*x);
const ven=(t,a,b,f=.4)=>Math.min(su(pr(t,a,a+f)),1-su(pr(t,b-f,b)));
const [v1,v2,v3,F]=(location.hash.slice(1)||"0.3,3.47,10.71,17.75").split(",").map(Number);
window.pintar=(t)=>{
  const set=(id,o,dy=0)=>{const e=document.getElementById(id);e.style.opacity=o.toFixed(3);e.style.transform=`translateY(${dy.toFixed(1)}px)`;};
  const L=v3-v2, c1=v2+L*.48;  // mitad: de la instalación al juego
  set("a",ven(t,0,v2-.05,.35),(1-su(pr(t,0,.6)))*30);
  // Teléfono con las pantallas reales
  const tel=document.getElementById("tel");
  const ot=ven(t,v2-.05,v3+.05,.45);
  tel.style.opacity=ot.toFixed(3);
  tel.style.transform=`translateY(${((1-su(pr(t,v2-.05,v2+.6)))*160).toFixed(1)}px) scale(${(0.96+0.04*su(pr(t,v2,v2+.6))).toFixed(3)})`;
  const cortes=[v2-.05,v2+L*.22,c1,v2+L*.74,v3+.05];
  ["p1","p2","p3","p4"].forEach((id,i)=>{
    const e=document.getElementById(id);
    e.style.opacity=(i===0?1:su(pr(t,cortes[i]-.15,cortes[i]+.2))*(1)).toFixed(3);
    if(i<3&&t>cortes[i+1]+.2)e.style.opacity="0";
    const k=pr(t,cortes[i],cortes[i+1]);
    e.style.transform=`translateY(${(-k*(i===2?60:30)).toFixed(1)}px)`;
  });
  set("b",ven(t,v2,c1,.35),(1-su(pr(t,v2,v2+.5)))*24);
  set("b2",ven(t,c1,v3,.35),0);
  set("g",ven(t,v2+.4,v3,.4),(1-su(pr(t,v2+.4,v2+.9)))*24);
  set("d",ven(t,v3-.05,F+1,.45),(1-su(pr(t,v3-.05,v3+.6)))*30);
  set("z",su(pr(t,v3+2.4,v3+3)),(1-su(pr(t,v3+2.4,v3+3.1)))*34);
  document.getElementById("sombra2").style.opacity=(su(pr(t,v3+2.2,v3+2.9))).toFixed(3);
  document.getElementById("sombra").style.opacity=(t>v2&&t<v3?0:1).toFixed(3);
  document.getElementById("m").style.opacity=(t>v2&&t<v3?0:.85).toFixed(3);
};
</script></body></html>
