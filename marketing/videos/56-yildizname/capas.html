<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:C;src:url(../../../src/app/fuentes/CormorantGaramond-SemiBold.ttf)}
@font-face{font-family:CI;src:url(../../../src/app/fuentes/CormorantGaramond-Italic.ttf)}
@font-face{font-family:I;src:url(../../../src/app/fuentes/Inter-SemiBold.ttf)}
@font-face{font-family:NA;src:url(fuentes/NotoNaskhArabic.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent;font-variant-numeric:lining-nums}
.sombra{position:absolute;left:0;right:0;opacity:0}
#arriba{top:0;height:620px;background:linear-gradient(180deg,rgba(11,7,22,.88) 0%,rgba(11,7,22,.55) 55%,rgba(11,7,22,0) 100%)}
#abajo{bottom:0;height:900px;background:linear-gradient(0deg,rgba(11,7,22,.94) 0%,rgba(11,7,22,.65) 55%,rgba(11,7,22,0) 100%)}
.c{position:absolute;left:60px;right:60px;text-align:center;opacity:0}
.k{font-family:I;font-size:30px;letter-spacing:.3em;color:#ece6f7;text-shadow:0 2px 10px #0b0716}
.t{font-family:C;color:#f1d99a;line-height:1.04;margin-top:12px;text-shadow:0 0 40px rgba(241,217,154,.6),0 0 100px rgba(240,150,80,.35),0 3px 16px #0b0716}
.s{font-family:CI;font-size:60px;color:#fff;margin-top:12px;text-shadow:0 3px 16px #0b0716}
.boton{display:inline-block;margin-top:30px;padding:16px 46px;border-radius:999px;border:3px solid #f1d99a;background:rgba(11,7,22,.72);font-family:I;font-size:44px;color:#f1d99a}
body.ar .k,body.ar .t,body.ar .s{font-family:NA,C;letter-spacing:0}
body.ar .k{font-size:40px}
body.ar .s{font-size:64px}
.marca{position:absolute;left:0;right:0;bottom:250px;text-align:center;font-family:I;font-size:24px;letter-spacing:.3em;color:#ece6f7;text-shadow:0 2px 10px #0b0716;opacity:.85}
.marca b{color:#f1d99a}
</style></head><body>
<div class="sombra" id="arriba"></div><div class="sombra" id="abajo"></div>
<div id="tarjetas"></div>
<p class="marca"><b>ARCANA</b> · <span id="lema">SIBILA TE LEE</span></p>
<script>
// Tarjetas: [kicker, título, subtítulo, posición (arriba/abajo), tamaño del título, botón]
const T={
 es:{lema:"SIBILA TE LEE",c:[
  ["EL ARCANO DE SIBILA · #4","Yıldızname","el libro de las estrellas ✨","arriba",120],
  ["ESTAMBUL OTOMANO","Cada letra<br>tiene un número","","abajo",100],
  ["","Tu nombre<br>+ el de tu madre","","arriba",104],
  ["","÷ 12","tu estrella · tu planeta · tu día","abajo",130],
  ["LEYLA + DENIZ","80 + 81 = 161","Leo ☀️ · el Sol · domingo","fin",110],
  ["","¿Cuál es<br>tu estrella?","","fin",104,"🔮 miarcana.com/yildizname"]]},
 tr:{lema:"SİBİLA SENİ OKUR",c:[
  ["SİBİLA'NIN SIRLARI · #4","Yıldızname","yıldızların kitabı ✨","arriba",120],
  ["OSMANLI İSTANBUL'U","Her harfin<br>bir sayısı var","","abajo",100],
  ["","Senin adın<br>+ annenin adı","","arriba",104],
  ["","÷ 12","yıldızın · gezegenin · günün","abajo",130],
  ["LEYLA + DENİZ","80 + 81 = 161","Aslan ☀️ · Güneş · Pazar","fin",110],
  ["","Senin yıldızın<br>hangisi?","","fin",104,"🔮 miarcana.com/tr/yildizname"]]},
 fr:{lema:"SIBILA TE LIT",c:[
  ["L'ARCANE DE SIBILA · #4","Yıldızname","le livre des étoiles ✨","arriba",120],
  ["ISTANBUL OTTOMANE","Chaque lettre<br>a un nombre","","abajo",100],
  ["","Ton prénom<br>+ celui de ta mère","","arriba",96],
  ["","÷ 12","ton étoile · ta planète · ton jour","abajo",130],
  ["LEYLA + DENIZ","80 + 81 = 161","Lion ☀️ · le Soleil · dimanche","fin",110],
  ["","Quelle est<br>ton étoile ?","","fin",104,"🔮 miarcana.com/fr/yildizname"]]},
 ar:{lema:"سيبيلا تقرأ لك",c:[
  ["أسرار سيبيلا · #4","يلدز نامه","كتاب النجوم ✨","arriba",110],
  ["إسطنبول العثمانية","لكل حرف رقم","","abajo",110],
  ["","اسمك<br>+ اسم أمك","","arriba",110],
  ["","÷ 12","برجك · كوكبك · يومك","abajo",130],
  ["ليلى + دينيز","80 + 81 = 161","الأسد ☀️ · الشمس · الأحد","fin",110],
  ["","ما هو نجمك؟","","fin",110,"🔮 miarcana.com/ar/yildizname"]]},
};
const h=(location.hash.slice(1)||"7.3,14.6,22.4,30.2,40.4,46,es").split(",");
const LANG=h[6]||"es",F=Number(h[5]);
const B=[0.3,...h.slice(0,5).map(Number),F];
const L=T[LANG];document.getElementById("lema").textContent=L.lema;
if(LANG==="ar"){document.body.dir="rtl";document.body.classList.add("ar");}
const cont=document.getElementById("tarjetas");
L.c.forEach(([k,t,s,pos,tam,boton],i)=>{const d=document.createElement("div");d.className="c";d.id="c"+i;d.style.top=pos==="arriba"?"130px":pos==="fin"?"1300px":"1180px";
 d.innerHTML=(k?`<div class="k">${k}</div>`:"")+`<div class="t" dir="${/^[\d÷+=\s]+$/.test(t)?"ltr":"auto"}" style="font-size:${tam}px">${t}</div>`+(s?`<div class="s" dir="auto">${s}</div>`:"")+(boton?`<div class="boton" dir="ltr">${boton}</div>`:"");cont.appendChild(d);});
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),pr=(t,a,b)=>cl((t-a)/(b-a)),su=x=>x*x*(3-2*x);
const ven=(t,a,b,f=.4)=>Math.min(su(pr(t,a,a+f)),1-su(pr(t,b-f,b)));
window.pintar=(t)=>{let arriba=0,abajo=0;
 L.c.forEach((c,i)=>{const a=B[i],b=i===L.c.length-1?F+1:B[i+1];const o=ven(t,a,b);const e=document.getElementById("c"+i);e.style.opacity=o.toFixed(3);e.style.transform=`translateY(${((1-su(pr(t,a,a+.6)))*30).toFixed(1)}px)`;if(c[3]==="arriba")arriba=Math.max(arriba,o);else abajo=Math.max(abajo,o);});
 const ultima=Number(document.getElementById("c"+(L.c.length-1)).style.opacity||0);document.querySelector(".marca").style.opacity=(0.85*(1-ultima)).toFixed(3);document.getElementById("arriba").style.opacity=arriba.toFixed(3);document.getElementById("abajo").style.opacity=abajo.toFixed(3);};
window.pintar(0);
</script></body></html>
