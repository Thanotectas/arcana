<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:C;src:url(../../../src/app/fuentes/CormorantGaramond-SemiBold.ttf)}
@font-face{font-family:CI;src:url(../../../src/app/fuentes/CormorantGaramond-Italic.ttf)}
@font-face{font-family:I;src:url(../../../src/app/fuentes/Inter-SemiBold.ttf)}
@font-face{font-family:IR;src:url(../../../src/app/fuentes/Inter-Regular.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent;font-variant-numeric:lining-nums}
#sombra{position:absolute;left:0;right:0;top:0;height:560px;background:linear-gradient(180deg,rgba(11,7,22,.85) 0%,rgba(11,7,22,.55) 50%,rgba(11,7,22,0) 100%)}
#sombra2{position:absolute;left:0;right:0;bottom:0;height:760px;background:linear-gradient(0deg,rgba(11,7,22,.9) 0%,rgba(11,7,22,.6) 55%,rgba(11,7,22,0) 100%);opacity:0}
.c{position:absolute;left:60px;right:60px;text-align:center;opacity:0}
.brillo{font-family:C;color:#f7c6d9;text-shadow:0 0 40px rgba(247,198,217,.75),0 0 100px rgba(241,217,154,.4),0 3px 16px #0b0716}
.marca{position:absolute;left:0;right:0;bottom:250px;text-align:center;font-family:I;font-size:24px;letter-spacing:.3em;color:#ece6f7;text-shadow:0 2px 10px #0b0716;opacity:.85}
.marca b{color:#f1d99a}
</style></head><body>
<div id="sombra"></div><div id="sombra2"></div>
<div class="c" id="a" style="top:110px"><div style="font-family:I;font-size:28px;letter-spacing:.3em;color:#ece6f7;text-shadow:0 2px 10px #0b0716">HOY · 15 DE NOVIEMBRE</div>
  <div class="brillo" style="font-size:104px;line-height:1.02;margin-top:12px">Venus vuelve<br>a avanzar 💗</div></div>
<div class="c" id="b" style="top:120px"><div class="brillo" style="font-size:80px;line-height:1.05">Lo que se enfrió<br>en el amor…</div>
  <div style="font-family:CI;font-size:58px;color:#fff;margin-top:10px;text-shadow:0 3px 16px #0b0716">vuelve a calentarse ✨</div></div>
<div class="c" id="z" style="top:1170px"><span style="display:inline-flex;align-items:center;gap:14px;padding:12px 30px;border-radius:999px;background:#e0453a;font-family:I;font-size:34px;letter-spacing:.2em;color:#fff"><span id="punto" style="width:18px;height:18px;border-radius:50%;background:#fff"></span>EN VIVO HOY</span>
  <div style="font-family:C;font-size:92px;line-height:1.02;color:#f1d99a;margin-top:18px;text-shadow:0 0 40px rgba(241,217,154,.4),0 3px 16px #0b0716">8:00 p.m. · YouTube</div>
  <div style="font-family:IR;font-size:32px;color:#ece6f7;margin-top:12px;text-shadow:0 2px 10px #0b0716">7 p.m. México · 9 p.m. Venezuela · 10 p.m. Argentina y Chile</div>
  <div style="display:inline-block;margin-top:22px;padding:14px 40px;border-radius:999px;border:3px solid #f1d99a;background:rgba(11,7,22,.7);font-family:I;font-size:42px;color:#f1d99a">▶ @miarcana · trae tu pregunta</div></div>
<p class="marca"><b>ARCANA</b> · SIBILA TE LEE</p>
<script>
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),pr=(t,a,b)=>cl((t-a)/(b-a)),su=x=>x*x*(3-2*x);
const ven=(t,a,b,f=.4)=>Math.min(su(pr(t,a,a+f)),1-su(pr(t,b-f,b)));
const [v1,v2,v3,F]=(location.hash.slice(1)||"0.3,7.6,15.7,24").split(",").map(Number);
window.pintar=(t)=>{
  const set=(id,o,dy)=>{const e=document.getElementById(id);e.style.opacity=o.toFixed(3);e.style.transform=`translateY(${dy.toFixed(1)}px)`;};
  set("a",ven(t,0,v2-.1),(1-su(pr(t,0,.6)))*30);
  set("b",ven(t,v2-.1,v3-.1),(1-su(pr(t,v2-.1,v2+.5)))*30);
  set("z",su(pr(t,v3-.1,v3+.5)),(1-su(pr(t,v3-.1,v3+.6)))*34);
  document.getElementById("sombra").style.opacity=(1-su(pr(t,v3-.3,v3+.3))).toFixed(3);
  document.getElementById("sombra2").style.opacity=su(pr(t,v3-.3,v3+.3)).toFixed(3);
  document.getElementById("punto").style.opacity=(.35+.65*(.5+.5*Math.sin(t*6))).toFixed(2);
};
window.pintar(0);
</script></body></html>
