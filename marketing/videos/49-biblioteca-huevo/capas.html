<script>
const TX={
 es:{k1:"BIBLIOTECA DE SIBILA · #2",t1:"La limpia<br>con huevo 🥚",k2:"MESOAMÉRICA",t2:"Hierbas, flores<br>y copal",k3:"",t3:"Dos mundos que<br>se encontraron",t4:"De la cabeza a los pies<br>· en una dirección",t5:"Se rompe en un<br>vaso con agua",t6:"🫧 cansancio que se fue<br>🕯️ envidias que se llevó<br>🌕 energía en paz",k7:"",t7:"",z1:"¿Qué se llevó<br>tu limpia?",z2:"📸 miarcana.com/huevo",z3:"La historia completa: miarcana.com/biblioteca",marca:"BIBLIOTECA DE SIBILA"},
 pt:{k1:"BIBLIOTECA DA SIBILA · #2",t1:"A limpeza<br>com ovo 🥚",k2:"MESOAMÉRICA",t2:"Ervas, flores<br>e copal",k3:"",t3:"Dois mundos que<br>se encontraram",t4:"Da cabeça aos pés<br>· numa só direção",t5:"Quebra-se num<br>copo com água",t6:"🫧 cansaço que foi embora<br>🕯️ invejas que ele levou<br>🌕 energia em paz",k7:"",t7:"",z1:"O que a sua<br>limpeza levou?",z2:"📸 miarcana.com/pt/huevo",z3:"",marca:"BIBLIOTECA DA SIBILA"},
};
// #idioma,s1,s2,B1,B2,B3,s4,B4,B5 (segundos del video): fin del título, fin de la historia, cortes de imagen.
const p=(location.hash.slice(1)||"es,5.1,13.1,18.6,22.0,27.8,30.9,39.3,45.7").split(",");
const L=TX[p[0]]?p[0]:"es";const [s1,s2,B1,B2,B3,s4,B4,B5]=p.slice(1).map(Number);
document.querySelectorAll("[data-k]").forEach(e=>{e.innerHTML=TX[L][e.dataset.k]||"";});
if(L==="ar"){document.body.classList.add("ar");document.body.dir="rtl";}
const V={c1:[0.3,s1,"a"],c2:[s1,B1,"a"],c3:[B1,B2,"a"],c4:[B2,B3,"a"],c5:[B3,s4,"a"],c6:[s4,B4,"a"],c7:[B5,B5,"a"],z:[B5,999,"b"]};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),pr=(t,a,b)=>cl((t-a)/(b-a)),su=x=>x*x*(3-2*x);
const ven=(t,a,b,f=.45)=>Math.min(su(pr(t,a,a+f)),1-su(pr(t,b-f,b)));
window.pintar=(t)=>{let arriba=0,abajo=0;
  for(const [id,[a,b,lado]] of Object.entries(V)){const e=document.getElementById(id);const o=ven(t,a,b);e.style.opacity=o.toFixed(3);e.style.transform=`translateY(${((1-su(pr(t,a,a+.6)))*30).toFixed(1)}px)`;if(lado==="a")arriba=Math.max(arriba,o);else abajo=Math.max(abajo,o);}
  document.getElementById("arriba").style.opacity=arriba.toFixed(3);document.getElementById("abajo").style.opacity=abajo.toFixed(3);};
window.pintar(0);
</script></body></html>
