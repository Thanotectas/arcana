<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:C;src:url(../../../src/app/fuentes/CormorantGaramond-SemiBold.ttf)}
@font-face{font-family:I;src:url(../../../src/app/fuentes/Inter-SemiBold.ttf)}
@font-face{font-family:NA;src:url(fuentes/NotoNaskhArabic.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
#sombra{position:absolute;left:0;right:0;bottom:0;height:720px;background:linear-gradient(0deg,rgba(10,6,24,.82),rgba(10,6,24,.55) 55%,rgba(10,6,24,0))}
#sombraA{position:absolute;left:0;right:0;top:0;height:520px;background:linear-gradient(180deg,rgba(10,6,24,.75),rgba(10,6,24,0));opacity:0}
.t{position:absolute;left:60px;right:60px;bottom:330px;text-align:center;opacity:0;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.85)}
.t .lugar{display:block;font-family:I;font-size:40px;letter-spacing:.18em;color:#f1d99a;margin-bottom:18px;text-transform:uppercase}
.t .frase{display:block;font-family:C;font-size:84px;line-height:1.08}
body.ar .t .lugar{font-family:NA;letter-spacing:0;font-size:48px;text-transform:none}
body.ar .t .frase,body.ar #titulo,body.ar #sub,body.ar #cta1{font-family:NA;line-height:1.35}
body.ar .t .frase{font-size:72px}
#serie{position:absolute;top:150px;left:0;right:0;text-align:center;font-family:I;font-size:34px;letter-spacing:.3em;color:#f1d99a;opacity:0;text-shadow:0 2px 12px #000}
#titulo{position:absolute;top:220px;left:40px;right:40px;text-align:center;font-family:C;font-size:150px;line-height:1;color:#fff;opacity:0;text-shadow:0 0 40px rgba(80,140,255,.55),0 6px 20px #000}
#sub{position:absolute;top:410px;left:80px;right:80px;text-align:center;font-family:C;font-size:58px;color:#e9dcff;opacity:0;text-shadow:0 4px 14px #000}
#cta{position:absolute;left:50px;right:50px;bottom:300px;text-align:center;opacity:0}
#cta1{font-family:C;font-size:88px;line-height:1.08;color:#fff;text-shadow:0 4px 18px #000}
#cta2{margin-top:30px;font-family:I;font-size:50px;color:#f1d99a;text-shadow:0 0 26px rgba(241,217,154,.55),0 3px 12px #000}
#marca{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-family:I;font-size:24px;letter-spacing:.3em;color:#e9dcff;opacity:.85;text-shadow:0 2px 10px #000}
#marca b{color:#f1d99a}
</style></head><body>
<div id="sombraA"></div><div id="sombra"></div>
<div id="serie"></div><div id="titulo"></div><div id="sub"></div>
<div id="cuadros"></div>
<div id="cta"><div id="cta1"></div><div id="cta2"></div></div>
<p id="marca"><b>ARCANA</b> · <span id="lema"></span></p>
<script>
// Tramos de la base (base.sh): museo 0–6.5 · nazar 6.5–12.5 · bazar 12.5–16 · khamsa 16–20.5 · huevo 20.5–27 · abuela 27–35
const T={
 es:{serie:"BIBLIOTECA DE SIBILA · #3",titulo:"El mal de ojo",sub:"una de las creencias más antiguas del mundo",lema:"SIBILA TE LEE",
  c:[["Grecia y Roma","La mirada que pesa"],["Turquía","El nazar: el ojo que devuelve la mirada"],["","En casas, autos y cunas"],
     ["Norte de África y Oriente Medio","La khamsa cuida la entrada"],["Latinoamérica","La abuela pasa el huevo y lee el vaso"],["","Tres caminos,<br>una misma idea:<br>cuidar a los que queremos"]],
  cta1:"¿Hiciste tu limpia?<br>Sibila lee tu vaso 🔮",cta2:"miarcana.com/huevo"},
 tr:{serie:"SİBİLA'NIN KÜTÜPHANESİ · #3",titulo:"Nazar",sub:"dünyanın en eski inançlarından biri",lema:"SİBİLA SENİ OKUR",
  c:[["Yunan ve Roma","Ağır gelen bakış"],["Türkiye","Nazar boncuğu: bakışı geri çeviren göz"],["","Evlerde, arabalarda, beşiklerde"],
     ["Kuzey Afrika ve Orta Doğu","Hamsa kapıyı bekler"],["Latin Amerika","Büyükanne yumurtayı gezdirir, bardağı okur"],["","Üç yol, tek bir fikir:<br>sevdiklerimizi kollamak"]],
  cta1:"Yumurta bardağını<br>Sibila okusun 🔮",cta2:"miarcana.com/tr/huevo"},
 ar:{serie:"مكتبة سيبيلا · \u2066#3\u2069",titulo:"العين",sub:"من أقدم المعتقدات في العالم",lema:"سيبيلا تقرأ لك",rtl:true,
  c:[["اليونان وروما","النظرة الثقيلة"],["تركيا","النَّظَر: العين التي تردّ النظرة"],["","في البيوت والسيارات والمهود"],
     ["شمال أفريقيا والشرق الأوسط","الخمسة تحرس المدخل"],["أمريكا اللاتينية","الجدّة تمرّر البيضة وتقرأ الكأس"],["","ثلاث طرق وفكرة واحدة:<br>أن نرعى من نحب"]],
  cta1:"هل جرّبت البيضة؟<br>سيبيلا تقرأ كأسك 🔮",cta2:"miarcana.com/ar/huevo"},
};
// Hash: «idioma» (sin voz) o «idioma,v,fin del título,ini1,fin1,…,ini6,fin6,inicio del cierre» (con voz, a los tiempos de la voz)
const H=(location.hash.slice(1)||"es").split(",");const LANG=H[0];const L=T[LANG];const VOZ=H[1]==="v";
let FT=3.2,TR=[[3.3,6.4],[6.8,12.4],[12.7,15.9],[16.2,20.4],[20.8,26.9],[27.2,31]],CT=31.2;
if(VOZ){const n=H.slice(2).map(Number);FT=n[0];TR=[0,1,2,3,4,5].map(i=>[n[1+2*i],n[2+2*i]]);CT=n[13];
 // Con voz, el orden sigue a la narración: primero «en puertas, autos y cunas» y luego el nazar
 const [a,b]=[L.c[1],L.c[2]];L.c[1]=[a[0],b[1]];L.c[2]=["",a[1]];}const $=id=>document.getElementById(id);
if(L.rtl){document.body.classList.add("ar");document.body.dir="rtl";$("serie").style.letterSpacing="0";$("serie").style.fontFamily="NA";$("serie").style.fontSize="44px";$("titulo").style.fontSize="170px";$("titulo").style.top="200px";$("sub").style.top="450px";}
$("serie").textContent=L.serie;$("titulo").textContent=L.titulo;$("sub").textContent=L.sub;$("lema").textContent=L.lema;
$("cta1").innerHTML=L.cta1;$("cta2").textContent=L.cta2;$("cta2").dir="ltr";
L.c.forEach(([a,b],i)=>{const d=document.createElement("div");d.className="t";d.id="t"+i;d.innerHTML=(a?`<span class="lugar">${a}</span>`:"")+`<span class="frase">${b}</span>`;$("cuadros").appendChild(d);});
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),pr=(t,a,b)=>cl((t-a)/(b-a)),su=x=>x*x*(3-2*x);
const ven=(t,a,b,f=.4)=>Math.min(su(pr(t,a,a+f)),1-su(pr(t,b-f,b)));
window.pintar=(t)=>{
 $("sombraA").style.opacity=ven(t,0,FT+.1,.3);
 $("serie").style.opacity=ven(t,.2,FT);$("titulo").style.opacity=ven(t,.5,FT);$("titulo").style.transform=`scale(${.92+.08*su(pr(t,.5,1.3))})`;
 $("sub").style.opacity=ven(t,1.1,FT);
 TR.forEach(([a,b],i)=>{const o=ven(t,a,b);const e=$("t"+i);e.style.opacity=o;e.style.transform=`translateY(${(1-su(pr(t,a,a+.5)))*24}px)`;});
 const c=su(pr(t,CT,CT+.6));$("cta").style.opacity=c;$("cta").style.transform=`translateY(${(1-c)*24}px)`;
};
window.pintar(0);
</script></body></html>
