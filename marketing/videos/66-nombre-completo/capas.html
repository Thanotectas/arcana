<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:I;src:url(../../../src/app/fuentes/Inter-SemiBold.ttf)}
@font-face{font-family:NA;src:url(fuentes/NotoNaskhArabic.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent;direction:rtl}
#sa{position:absolute;left:0;right:0;top:0;height:620px;background:linear-gradient(180deg,rgba(10,6,24,.85),rgba(10,6,24,.5) 60%,rgba(10,6,24,0))}
#sb{position:absolute;left:0;right:0;bottom:0;height:980px;background:linear-gradient(0deg,rgba(10,6,24,.94),rgba(10,6,24,.72) 55%,rgba(10,6,24,0));opacity:0}
.c{position:absolute;left:50px;right:50px;text-align:center;color:#fff;font-family:NA;text-shadow:0 4px 22px #000}
#gancho{top:150px}
#g1{font-size:112px;line-height:1.3}
#g2{font-size:58px;line-height:1.45;color:#e9dcff;margin-top:6px}
#mini{top:120px;font-size:46px;color:#f1d99a;opacity:0}
#ejemplo{bottom:330px;opacity:0}
#nombre{font-size:150px;line-height:1.2;color:#f1d99a;text-shadow:0 0 40px rgba(241,217,154,.55),0 6px 22px #000}
#letras{display:flex;justify-content:center;gap:26px;margin-top:18px}
.l{display:flex;flex-direction:column;align-items:center;padding:14px 22px;border-radius:22px;background:rgba(12,8,30,.72);border:2px solid rgba(241,217,154,.55);opacity:0}
.l b{font-size:76px;line-height:1.2;font-weight:normal}
.l i{font-family:I;font-style:normal;font-size:40px;color:#f1d99a}
#total{margin-top:28px;font-family:I;font-size:72px;color:#fff;opacity:0}
#total span{color:#f1d99a}
#mas{bottom:300px;opacity:0}
#m0{font-size:70px;line-height:1.35;margin-bottom:26px}
.it{display:flex;align-items:center;gap:22px;margin:22px auto 0;width:860px;padding:20px 32px;border-radius:30px;background:rgba(12,8,30,.74);border:2px solid rgba(241,217,154,.55);font-size:60px;line-height:1.3;opacity:0}
.it span{font-size:58px;width:80px;text-align:center}
#cta{bottom:320px;opacity:0}
#cta0{font-size:66px;line-height:1.4;color:#e9dcff}
#cta1{font-size:92px;line-height:1.3;color:#f1d99a;text-shadow:0 0 40px rgba(241,217,154,.5),0 6px 22px #000;margin-top:10px}
#cta2{font-size:118px;line-height:1.3;margin-top:36px}
#marca{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-family:I;font-size:24px;letter-spacing:.3em;color:#e9dcff;opacity:.85;text-shadow:0 2px 10px #000;direction:ltr}
#marca b{color:#f1d99a}#marca span{font-family:NA;letter-spacing:0;font-size:30px}
</style></head><body>
<div id="sa"></div><div id="sb"></div>
<div id="gancho" class="c"><div id="g1">اكتب اسمك 👇</div><div id="g2">وسيبيلا تحسب قيمته بحساب الجُمَّل</div></div>
<div id="mini" class="c">👇 اكتب اسمك في التعليقات</div>
<div id="ejemplo" class="c"><div id="nombre">مريم</div>
 <div id="letras"><div class="l"><b>م</b><i>40</i></div><div class="l"><b>ر</b><i>200</i></div><div class="l"><b>ي</b><i>10</i></div><div class="l"><b>م</b><i>40</i></div></div>
 <div id="total"><span>290</span> = 40 + 10 + 200 + 40</div></div>
<div id="mas" class="c"><div id="m0">اسمك يخفي أكثر من رقم</div>
 <div class="it"><span>✦</span>الحرف الذي يحكم اسمك</div>
 <div class="it"><span>💞</span>كيف تحب وماذا تحتاج</div>
 <div class="it"><span>🌟</span>مواهبك وطريقك</div></div>
<div id="cta" class="c"><div id="cta0">القراءة الكاملة لاسمك</div><div id="cta1">الرابط في البايو 🔗</div><div id="cta2">اكتب اسمك 👇</div></div>
<p id="marca"><b>ARCANA</b> · <span>سيبيلا تقرأ لك</span></p>
<script>
// #ar,tCalculo,tMas,tHace,tComo,tMawahib,tCompleta,tEscribe,fin
const [,...ts]=decodeURIComponent(location.hash.slice(1)).split(",");
const [tC,tM,tH,tK,tW,tQ,tE,tFin]=ts.map(Number);
const $=id=>document.getElementById(id);
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),pr=(t,a,b)=>cl((t-a)/(b-a)),su=v=>v*v*(3-2*v);
const ven=(t,a,b,f=.4)=>Math.min(su(pr(t,a,a+f)),1-su(pr(t,b-f,b)));
const aparece=(el,t,a,dx=-50)=>{const o=su(pr(t,a,a+.35));el.style.opacity=o;el.style.transform=`translateX(${(1-o)*dx}px) scale(${1+0.06*Math.max(0,1-pr(t,a,a+.6))})`;el.style.boxShadow=`0 0 ${40*Math.max(0,1-pr(t,a,a+.8))}px rgba(241,217,154,.8)`;};
window.pintar=t=>{
 const g=1-su(pr(t,tC+1.2,tC+1.8));$("gancho").style.opacity=g*su(pr(t,0,.35));
 $("gancho").style.transform=`scale(${1+0.04*Math.sin(t*2.2)})`;
 $("mini").style.opacity=su(pr(t,tC+1.6,tC+2.1))*(1-su(pr(t,tE-0.6,tE-0.2)));
 $("sb").style.opacity=su(pr(t,tC-0.2,tC+0.4));
 // Ejemplo: مريم letra por letra y el total.
 $("ejemplo").style.opacity=ven(t,tC,tM-0.1);
 [...$("letras").children].forEach((l,i)=>aparece(l,t,tC+0.5+i*0.35,40));
 $("total").style.opacity=su(pr(t,tC+2.0,tC+2.4));
 // Lo que esconde el nombre.
 $("mas").style.opacity=ven(t,tM,tQ-0.1);
 [...$("mas").querySelectorAll(".it")].forEach((el,i)=>aparece(el,t,[tH,tK,tW][i]-0.15));
 // Cierre.
 const c=su(pr(t,tQ,tQ+.4));$("cta").style.opacity=c;
 $("cta2").style.opacity=su(pr(t,tE,tE+.4));$("cta2").style.transform=`scale(${1+0.05*Math.sin((t-tE)*4)})`;
 $("marca").style.opacity=(0.85*(1-ven(t,tC-0.1,tQ-0.1))).toFixed(3);
};
window.pintar(0);
</script></body></html>
