name: Android (Google Play)

on:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Configurar Bubblewrap (JDK y SDK del runner)
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json

      - name: Restaurar la llave de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "Falta el secreto ANDROID_KEYSTORE_BASE64"; exit 1; fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then echo "Falta el secreto ANDROID_KEYSTORE_PASSWORD"; exit 1; fi
          # Copiado desde el Bloc de notas puede traer saltos de línea (\r\n) o espacios: se quitan.
          limpio=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n\t')
          echo "Largo del secreto sin espacios: ${#limpio} caracteres"
          if ! printf '%s' "$limpio" | base64 -d > android/arcana-upload.keystore; then
            echo "El secreto ANDROID_KEYSTORE_BASE64 no es base64 válido: vuelve a copiar todo el archivo keystore.base64"; exit 1
          fi
          # La llave debe abrirse con la contraseña antes de compilar.
          if ! keytool -list -keystore android/arcana-upload.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null; then
            echo "La llave no abre con ANDROID_KEYSTORE_PASSWORD: revisa la contraseña o vuelve a copiar keystore.base64 completo"; exit 1
          fi
          echo "Llave restaurada y verificada"

      - name: Generar el proyecto Android
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade --manifest ./twa-manifest.json

      - name: Compilar y firmar
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation --manifest ./twa-manifest.json

      - name: Publicar los archivos
        uses: actions/upload-artifact@v4
        with:
          name: arcana-android
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          if-no-files-found: error
